# Demo configuration for the mock data - builds a report without any vCenter.
#   python3 examples/generate-mock-data.py examples/mock-data
#   python3 python/memtier.py report --config examples/mock.ini --output examples/mock-trend-report.html
[vcenter]
servers =
[collector]
data_dir = mock-data
[report]
report_dir = mock-reports
days = 30
stretched_clusters = Metro-Stretched
title = VMware Memory Tiering Report (mock data)
